<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יפן 2 — מתכנן טיול דינמי</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ============================================================
     HEADER + NAVIGATION (4 work-layer tabs)
     ============================================================ -->
<header class="app-header">
  <div class="app-header-title">
    <span id="tripTitle">יפן</span>
    <span class="app-header-sub" id="tripSub"></span>
  </div>
  <nav class="app-tabs" id="appTabs">
    <button class="app-tab active" data-screen="planning">🗺 תכנון</button>
    <button class="app-tab" data-screen="times">🕐 זמנים</button>
    <button class="app-tab" data-screen="places">📍 מקומות</button>
    <button class="app-tab" data-screen="lodging">🏨 לינה</button>
    <button class="app-tab" data-screen="costs">💴 עלויות</button>
    <button class="app-tab" data-screen="summary">📋 סיכום</button>
  </nav>
  <div class="app-header-actions">
    <button class="hdr-btn" id="btnReset" title="אפס לברירת מחדל">↺ איפוס</button>
  </div>
</header>

<!-- ============================================================
     SHARED CHROME: filter bar + legend (always visible)
     ============================================================ -->
<div class="app-chrome" id="appChrome">
  <div class="filter-bar" id="filterBar"><!-- filters injected by filters.js --></div>
  <div class="legend" id="legend" style="display:none"></div>
</div>

<!-- ============================================================
     MAIN: map column + active screen panel
     ============================================================ -->
<main class="app-main">
  <div class="map-col" id="mapCol">
    <div id="leafletMap" class="leaflet-map"></div>
    <div class="map-missing" id="mapMissing"><!-- "X places need a location" --></div>
  </div>
  <section class="screen-panel" id="screenPanel"><!-- active screen injected by screens.js --></section>
</main>

<!-- shared modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"><button class="modal-close" id="modalClose">✕</button><div id="modalContent"></div></div>
</div>

<footer class="app-footer">יפן2 · מתכנן טיול דינמי · נתונים נשמרים אוטומטית בדפדפן</footer>

<!-- ============================================================
     SCRIPTS — classic load order (no ES modules; file:// safe)
     ============================================================ -->
<script src="data/base-kansai.js"></script>
<script src="data/base-hokkaido.js"></script>
<script src="data/base-tokyo.js"></script>
<script src="data/coords-lookup.js"></script>
<script src="js/normalize.js"></script>
<script src="js/store.js"></script>
<script src="js/components.js"></script>
<script src="js/map.js"></script>
<script src="js/filters.js"></script>
<script src="js/edit.js"></script>
<script src="js/detail.js"></script>
<script src="js/screens.js"></script>
<script src="js/app.js"></script>
</body>
</html>
